name: Deploy frontend to VDS

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

env:
  IMAGE_NAME: vk-app-frontend-frontend:latest
  VITE_API_URL: ${{ vars.VITE_API_URL || 'https://api.fr1gate.space' }}
  VITE_DEV_MODE: ${{ vars.VITE_DEV_MODE || 'false' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}
          build-args: |
            VITE_API_URL=${{ env.VITE_API_URL }}
            VITE_DEV_MODE=${{ env.VITE_DEV_MODE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VDS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Transfer image to VDS
        run: |
          docker save "$IMAGE_NAME" | gzip -1 | \
            ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ConnectTimeout=15 deploy@194.87.144.60 "gunzip | docker load"

      - name: Recreate container
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ConnectTimeout=15 deploy@194.87.144.60 "bash /home/deploy/deploy-frontend.sh"
